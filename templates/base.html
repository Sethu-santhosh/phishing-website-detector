<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishGuard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #ffffff;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(0, 190, 255, .28),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    rgba(125, 70, 255, .30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(0, 220, 255, .15),
                    transparent 35%
                ),

                #040a1b;
        }


        /* ========================================
           ANIMATED BACKGROUND
        ======================================== */

        .background-orb {
            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(100px);

            pointer-events: none;

            z-index: -1;

            opacity: .40;
        }


        .orb-blue {
            background: #009dff;

            top: 5%;
            left: -150px;

            animation:
                blueFloat
                10s
                ease-in-out
                infinite
                alternate;
        }


        .orb-purple {
            background: #8338ff;

            right: -150px;
            bottom: 5%;

            animation:
                purpleFloat
                12s
                ease-in-out
                infinite
                alternate;
        }


        @keyframes blueFloat {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(120px, 90px);
            }

        }


        @keyframes purpleFloat {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-120px, -80px);
            }

        }


        /* ========================================
           NAVIGATION
        ======================================== */

        .navbar {

            width: min(1200px, 92%);

            margin: 20px auto;

            padding: 13px 18px;

            display: flex;

            align-items: center;

            gap: 8px;

            border-radius: 20px;

            border:
                1px solid
                rgba(255,255,255,.20);

            background:
                rgba(255,255,255,.07);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:

                0 18px 55px
                rgba(0,0,0,.28),

                inset 0 1px
                rgba(255,255,255,.12);
        }


        /* BRAND */

        .brand {

            margin-right: auto;

            display: flex;

            align-items: center;

            gap: 10px;

            color: white;

            text-decoration: none;

            font-size: 23px;

            font-weight: 700;
        }


        .brand-name span {

            color: #39c8ff;
        }


        /* BRAND SHIELD */

        .brand-icon {

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                rgba(40,200,255,.12);

            border:
                1px solid
                rgba(40,200,255,.30);

            box-shadow:
                0 0 25px
                rgba(40,200,255,.12);
        }


        .brand-icon svg {

            width: 25px;
            height: 25px;

            fill: none;

            stroke: #42d7ff;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* NAV LINKS */

        .nav-links {

            display: flex;

            align-items: center;

            gap: 5px;
        }


        .nav-link {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 10px 14px;

            border-radius: 12px;

            color:
                rgba(255,255,255,.82);

            text-decoration: none;

            border:
                1px solid
                transparent;

            transition:
                .25s ease;
        }


        .nav-link svg {

            width: 18px;
            height: 18px;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

            transition: .25s ease;
        }


        .nav-link:hover {

            color: white;

            background:
                rgba(255,255,255,.09);

            border-color:
                rgba(255,255,255,.13);

            transform:
                translateY(-2px);
        }


        .nav-link:hover svg {

            color: #42d7ff;

            transform:
                scale(1.12);
        }


        .nav-link:active {

            transform:
                scale(.92);
        }


        /* ========================================
           MAIN
        ======================================== */

        main {

            width:
                min(1200px, 92%);

            margin:
                35px auto 60px;
        }


        /* ========================================
           GLASS CARD
        ======================================== */

        .card {

            padding: 28px;

            border-radius: 24px;

            background:
                rgba(255,255,255,.065);

            border:
                1px solid
                rgba(255,255,255,.17);

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:

                0 20px 60px
                rgba(0,0,0,.25),

                inset 0 1px
                rgba(255,255,255,.10);
        }


        /* ========================================
           INPUT
        ======================================== */

        input {

            width: 100%;

            padding:
                15px 17px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,.20);

            background:
                rgba(255,255,255,.075);

            color: white;

            outline: none;

            font-size: 15px;

            transition: .25s ease;
        }


        input::placeholder {

            color:
                rgba(255,255,255,.42);
        }


        input:focus {

            border-color:
                #36c8ff;

            box-shadow:
                0 0 25px
                rgba(54,200,255,.18);
        }


        /* ========================================
           BUTTON
        ======================================== */

        button {

            border: none;

            padding:
                14px 22px;

            border-radius: 14px;

            color: white;

            font-weight: 700;

            font-size: 14px;

            background:
                linear-gradient(
                    135deg,
                    #0799ff,
                    #7857ff
                );

            cursor: pointer;

            position: relative;

            overflow: hidden;

            transition:
                transform .15s ease,
                box-shadow .25s ease;
        }


        button:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(55,130,255,.35);
        }


        button:active {

            transform:
                scale(.91);
        }


        button:disabled {

            opacity: .65;

            cursor:
                not-allowed;
        }


        /* ========================================
           TABLE
        ======================================== */

        table {

            width: 100%;

            border-collapse:
                collapse;
        }


        th,
        td {

            padding: 13px;

            text-align: left;

            border-bottom:
                1px solid
                rgba(255,255,255,.12);
        }


        /* ========================================
           ERROR
        ======================================== */

        .errorlist {

            color:
                #ff7272;
        }


        /* ========================================
           FOOTER
        ======================================== */

        .footer {

            text-align: center;

            padding: 25px;

            color:
                rgba(255,255,255,.40);

            font-size: 13px;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .navbar {

                flex-wrap: wrap;

                padding: 12px 14px;
            }


            .brand {

                width: 100%;

                margin-bottom: 5px;
            }


            .nav-links {

                width: 100%;

                justify-content:
                    center;
            }


            .nav-link {

                padding:
                    9px 11px;

                font-size: 13px;
            }


            main {

                width: 94%;
            }

        }


        @media (max-width: 430px) {

            .nav-link span {

                display: none;
            }


            .nav-link {

                padding:
                    10px 13px;
            }


            .nav-link svg {

                width: 20px;
                height: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- Animated background -->

    <div class="background-orb orb-blue"></div>

    <div class="background-orb orb-purple"></div>


    <!-- ========================================
         ONE NAVIGATION ONLY
    ======================================== -->

    <nav class="navbar">


        <!-- BRAND -->

        <a href="/" class="brand">

            <span class="brand-icon">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M12 3L20 6V11C20 16.5 16.5 20 12 21C7.5 20 4 16.5 4 11V6L12 3Z">
                    </path>

                    <path
                        d="M9 12L11 14L15 10">
                    </path>

                </svg>

            </span>


            <span class="brand-name">
                Phish<span>Guard</span>
            </span>

        </a>


        <!-- LINKS -->

        <div class="nav-links">


            <!-- HOME -->

            <a href="/" class="nav-link">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M3 11L12 4L21 11">
                    </path>

                    <path
                        d="M5 10V20H19V10">
                    </path>

                    <path
                        d="M9 20V14H15V20">
                    </path>

                </svg>

                <span>Home</span>

            </a>


            <!-- HISTORY -->

            <a href="/history/" class="nav-link">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M5 4H19V20H5Z">
                    </path>

                    <path
                        d="M8 8H16">
                    </path>

                    <path
                        d="M8 12H16">
                    </path>

                    <path
                        d="M8 16H13">
                    </path>

                </svg>

                <span>History</span>

            </a>


            {% if user.is_authenticated %}


                <!-- LOGOUT -->

                <a href="/logout/" class="nav-link">

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M10 5H5V19H10">
                        </path>

                        <path
                            d="M14 8L19 12L14 16">
                        </path>

                        <path
                            d="M19 12H9">
                        </path>

                    </svg>

                    <span>Logout</span>

                </a>


            {% else %}


                <!-- LOGIN -->

                <a href="/login/" class="nav-link">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="12"
                            cy="8"
                            r="3">
                        </circle>

                        <path
                            d="M5 20C5.8 16.5 8.2 14.5 12 14.5C15.8 14.5 18.2 16.5 19 20">
                        </path>

                    </svg>

                    <span>Login</span>

                </a>


                <!-- REGISTER -->

                <a href="/register/" class="nav-link">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="9"
                            cy="8"
                            r="3">
                        </circle>

                        <path
                            d="M3 20C3.8 16.5 6 14.5 9 14.5C12 14.5 14.2 16.5 15 20">
                        </path>

                        <path
                            d="M17 11V17">
                        </path>

                        <path
                            d="M14 14H20">
                        </path>

                    </svg>

                    <span>Register</span>

                </a>


            {% endif %}


        </div>

    </nav>


    <!-- ========================================
         PAGE CONTENT
    ======================================== -->

    <main>


        {% for message in messages %}

            <div
                class="card"
                style="margin-bottom:20px;">

                {{ message }}

            </div>

        {% endfor %}


        {% block content %}

        {% endblock %}


    </main>


    <!-- FOOTER -->

    <footer class="footer">

        PhishGuard • Website Security Scanner

    </footer>


</body>

</html>
