services:
  - type: web
    name: phishing-website-detector
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn phishing_detector.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: phishing-detector-db
          property: connectionString

databases:
  - name: phishing-detector-db
    plan: free
